name: MallApp
options:
  bundleIdPrefix: com.secondhandmall
  deploymentTarget:
    iOS: "17.0"
targets:
  MallApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "MallApp.xcodeproj/**"
          - "MallAppTests/**"
          - "*.md"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.secondhandmall.MallApp
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MallAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MallAppTests
    dependencies:
      - target: MallApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.secondhandmall.MallAppTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MallApp:
    build:
      targets:
        MallApp: all
        MallAppTests: [test]
    test:
      targets:
        - MallAppTests
